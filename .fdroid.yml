Builds:
  - versionName: 0.7.0
    versionCode: 11
    commit: v0.7.0
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    rm:
      - app/src/main/jniLibs
      - runtime-payloads
    prebuild: sed -i '/include(":runtime-/d' settings.gradle.kts

MaintainerNotes: |-
  This recipe builds only the architecture-neutral main application. Prebuilt
  native payloads are removed before scanning, and runtime-pack modules are
  excluded from settings.gradle.kts before Gradle runs assembleRelease.

  Static hosting works without an add-on. Node.js, PHP, MariaDB, and connector
  support use separately installed FOSS runtime-pack applications. Those packs
  have distinct application IDs and are not outputs of this build recipe.

